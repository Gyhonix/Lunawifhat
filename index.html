<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNA Memecoin Tracker 🚀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(45deg, #00d4ff, #9b59b6, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .tagline {
            font-size: 1.2rem;
            color: #00d4ff;
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            animation: slideUp 0.6s ease-out;
        }

        input, button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #coinInput {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid #00d4ff;
            flex: 1;
            min-width: 200px;
            max-width: 400px;
        }

        #coinInput::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #coinInput:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            border-color: #9b59b6;
        }

        .btn {
            background: linear-gradient(45deg, #00d4ff, #9b59b6);
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px 30px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(155, 89, 182, 0.3);
            border: 2px solid #9b59b6;
            color: #9b59b6;
        }

        .btn-secondary:hover {
            background: rgba(155, 89, 182, 0.5);
            box-shadow: 0 5px 20px rgba(155, 89, 182, 0.4);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out;
        }

        .stat-card {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .coins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .coin-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            animation: scaleIn 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        .coin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .coin-card:hover::before {
            left: 100%;
        }

        .coin-card:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3), inset 0 0 20px rgba(0, 212, 255, 0.1);
            transform: translateY(-5px);
        }

        .coin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .coin-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .coin-symbol {
            background: linear-gradient(45deg, #9b59b6, #ff00ff);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .bookmark-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px;
            position: relative;
            z-index: 1;
        }

        .bookmark-btn.active {
            animation: bounce 0.6s ease-out;
        }

        .coin-info {
            position: relative;
            z-index: 1;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 0.95rem;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.6);
        }

        .info-value {
            font-weight: bold;
            color: #00d4ff;
        }

        .price-up {
            color: #2ecc71;
        }

        .price-down {
            color: #e74c3c;
        }

        .remove-btn {
            width: 100%;
            margin-top: 15px;
            background: rgba(231, 76, 60, 0.2);
            border: 2px solid #e74c3c;
            color: #e74c3c;
        }

        .remove-btn:hover {
            background: rgba(231, 76, 60, 0.4);
        }

        .bookmarks-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid rgba(0, 212, 255, 0.2);
        }

        .bookmarks-section h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #9b59b6;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .logo {
                font-size: 3rem;
            }

            .controls {
                flex-direction: column;
            }

            #coinInput {
                max-width: 100%;
            }

            .coins-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🌙</div>
            <h1>LUNA TRACKER</h1>
            <p class="tagline">The Community Memecoin Scanner 🚀</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <h3>Coins Tracked</h3>
                <div class="stat-value" id="trackedCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Bookmarked</h3>
                <div class="stat-value" id="bookmarkedCount">0</div>
            </div>
            <div class="stat-card">
                <h3>To The Moon</h3>
                <div class="stat-value">📈</div>
            </div>
            <div class="stat-card">
                <h3>Status</h3>
                <div class="stat-value">LIVE</div>
            </div>
        </div>

        <div class="controls">
            <input 
                type="text" 
                id="coinInput" 
                placeholder="Enter coin name or symbol... (e.g., DOGE, Shiba Inu)"
            >
            <button class="btn" onclick="scanCoin()">🔍 Scan Coin</button>
            <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear All</button>
        </div>

        <div id="coinsContainer" class="coins-grid"></div>

        <div class="bookmarks-section" id="bookmarksSection" style="display: none;">
            <h2>⭐ Bookmarked Gems</h2>
            <div id="bookmarksContainer" class="coins-grid"></div>
        </div>

        <div id="emptyState" class="empty-state">
            Start scanning for memecoins! Enter a coin name or symbol above. 🚀
        </div>
    </div>

    <script>
        // Mock coin data generator
        const coinDatabase = {
            'DOGE': { name: 'Dogecoin', price: 0.12, change: 5.2, volume: '450M', market: '17B' },
            'SHIB': { name: 'Shiba Inu', price: 0.000008, change: -2.5, volume: '280M', market: '4.8B' },
            'PEPE': { name: 'Pepe', price: 0.00000087, change: 12.8, volume: '120M', market: '3.6B' },
            'FLOKI': { name: 'Floki Inu', price: 0.000067, change: 8.3, volume: '95M', market: '2.1B' },
            'MOG': { name: 'Mog Coin', price: 0.0000018, change: -1.2, volume: '85M', market: '1.8B' },
            'LUNA': { name: 'Luna Wifhat', price: 0.045, change: 25.5, volume: '650M', market: '2.2B' },
            'BONK': { name: 'Bonk', price: 0.000098, change: 18.9, volume: '340M', market: '7.2B' },
            'WIF': { name: 'Wifhat', price: 0.0045, change: 15.3, volume: '210M', market: '1.4B' }
        };

        let trackedCoins = JSON.parse(localStorage.getItem('trackedCoins')) || [];
        let bookmarkedCoins = JSON.parse(localStorage.getItem('bookmarkedCoins')) || [];

        function generateCoinData(symbol) {
            const dbCoin = coinDatabase[symbol.toUpperCase()];
            if (dbCoin) return dbCoin;
            
            // Generate random data for custom coins
            return {
                name: symbol + ' Coin',
                price: (Math.random() * 0.1 + 0.00001).toFixed(8),
                change: (Math.random() * 40 - 20).toFixed(2),
                volume: (Math.random() * 500 + 50).toFixed(0) + 'M',
                market: (Math.random() * 10 + 1).toFixed(1) + 'B'
            };
        }

        function scanCoin() {
            const input = document.getElementById('coinInput');
            const symbol = input.value.trim().toUpperCase();

            if (!symbol) {
                alert('Please enter a coin symbol or name! 🌙');
                return;
            }

            if (trackedCoins.some(c => c.symbol === symbol)) {
                alert('Already tracking this coin! 📍');
                return;
            }

            const coinData = generateCoinData(symbol);
            const newCoin = {
                symbol: symbol,
                ...coinData,
                id: Date.now()
            };

            trackedCoins.push(newCoin);
            saveCoins();
            renderCoins();
            input.value = '';
            input.focus();
        }

        function toggleBookmark(id) {
            const coin = trackedCoins.find(c => c.id === id);
            if (!coin) return;

            const index = bookmarkedCoins.findIndex(c => c.id === id);
            if (index > -1) {
                bookmarkedCoins.splice(index, 1);
            } else {
                bookmarkedCoins.push(coin);
            }

            saveCoins();
            renderCoins();
        }

        function removeCoin(id) {
            trackedCoins = trackedCoins.filter(c => c.id !== id);
            bookmarkedCoins = bookmarkedCoins.filter(c => c.id !== id);
            saveCoins();
            renderCoins();
        }

        function saveCoins() {
            localStorage.setItem('trackedCoins', JSON.stringify(trackedCoins));
            localStorage.setItem('bookmarkedCoins', JSON.stringify(bookmarkedCoins));
        }

        function renderCoins() {
            const container = document.getElementById('coinsContainer');
            const bookmarksContainer = document.getElementById('bookmarksContainer');
            const bookmarksSection = document.getElementById('bookmarksSection');
            const emptyState = document.getElementById('emptyState');

            container.innerHTML = '';
            bookmarksContainer.innerHTML = '';

            document.getElementById('trackedCount').textContent = trackedCoins.length;
            document.getElementById('bookmarkedCount').textContent = bookmarkedCoins.length;

            if (trackedCoins.length === 0) {
                emptyState.style.display = 'block';
                bookmarksSection.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';

            trackedCoins.forEach(coin => {
                const card = createCoinCard(coin);
                container.appendChild(card);
            });

            if (bookmarkedCoins.length > 0) {
                bookmarksSection.style.display = 'block';
                bookmarkedCoins.forEach(coin => {
                    const card = createCoinCard(coin, true);
                    bookmarksContainer.appendChild(card);
                });
            } else {
                bookmarksSection.style.display = 'none';
            }
        }

        function createCoinCard(coin, isBookmark = false) {
            const isBookmarked = bookmarkedCoins.some(c => c.id === coin.id);
            const changeClass = coin.change >= 0 ? 'price-up' : 'price-down';
            const changeSymbol = coin.change >= 0 ? '📈' : '📉';

            const card = document.createElement('div');
            card.className = 'coin-card';
            card.innerHTML = `
                <div class="coin-header">
                    <div>
                        <div class="coin-name">${coin.symbol}</div>
                        <div style="font-size: 0.9rem; color: rgba(255,255,255,0.6);">${coin.name}</div>
                    </div>
                    <button 
                        class="bookmark-btn ${isBookmarked ? 'active' : ''}"
                        onclick="toggleBookmark(${coin.id})"
                        title="${isBookmarked ? 'Remove from bookmarks' : 'Add to bookmarks'}"
                    >
                        ${isBookmarked ? '⭐' : '☆'}
                    </button>
                </div>
                <div class="coin-info">
                    <div class="info-row">
                        <span class="info-label">Price:</span>
                        <span class="info-value">$${coin.price}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">24h Change:</span>
                        <span class="info-value ${changeClass}">${changeSymbol} ${coin.change > 0 ? '+' : ''}${coin.change}%</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Volume:</span>
                        <span class="info-value">${coin.volume}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Market Cap:</span>
                        <span class="info-value">${coin.market}</span>
                    </div>
                </div>
                <button class="btn remove-btn" onclick="removeCoin(${coin.id})">❌ Remove</button>
            `;

            return card;
        }

        function clearAll() {
            if (confirm('🚨 Clear all tracked coins? This cannot be undone!')) {
                trackedCoins = [];
                bookmarkedCoins = [];
                saveCoins();
                renderCoins();
            }
        }

        // Handle Enter key in input
        document.getElementById('coinInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                scanCoin();
            }
        });

        // Initial render
        renderCoins();
    </script>
</body>
</html>
